version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: rca_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data

  influxdb:
    image: influxdb:2.7
    container_name: rca_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=industrialrca_secret
      - DOCKER_INFLUXDB_INIT_ORG=factory
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=rca_super_secret_token_123
    volumes:
      - influxdb_data:/var/lib/influxdb2

volumes:
  mosquitto_data:
  influxdb_data:
